name: Retirement Smoke Test

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Base URL to verify'
        required: false
        default: 'https://finditviral.com'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LAUNCH_BASE_URL: ${{ github.event.inputs.url || 'https://finditviral.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run check
      - name: Verify retirement page in production
        run: npm run smoke
