name: Health Check

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'Base URL to test'
        required: false
        default: 'https://finditviral.com'

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LAUNCH_BASE_URL: ${{ github.event.inputs.url || 'https://finditviral.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run web smoke tests
        run: npm run smoke:web
        env:
          LAUNCH_BASE_URL: ${{ env.LAUNCH_BASE_URL }}
      - name: Job summary
        if: always()
        run: |
          echo "## Health Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** $LAUNCH_BASE_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
