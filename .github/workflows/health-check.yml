name: Retirement Health Check

# The service is retired. Keep manual verification; no recurring probes.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Origin URL to verify'
        required: false
        default: 'https://finditviral.pages.dev'

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LAUNCH_BASE_URL: ${{ github.event.inputs.url || 'https://finditviral.pages.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify closure page on former app and API routes
        run: npm run smoke:web
